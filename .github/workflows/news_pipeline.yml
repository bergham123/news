name: News Video Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        shell: powershell
        run: |
          choco install ffmpeg -y
          ffmpeg -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow arabic-reshaper python-bidi python-telegram-bot openai moviepy elevenlabs imageio imageio-ffmpeg numpy

      - name: Verify files
        shell: powershell
        run: |
          dir

      - name: Run script
        run: |
          python name: News Video Automation

